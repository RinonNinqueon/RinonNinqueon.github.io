{%- include header.html -%}
<h1>{{ page.title }}</h1>
<p class="meta">{{ page.date | date_to_string }}</p>
<p class="meta">Tags: {%- for tag in page.tags -%}
      <span class="badge text-bg-success taglist">{{tag}}</span>
      {%- endfor -%}
</p>
<hr>
<div class="post">
{{ content }}
</div>
