---
layout: default
title: "Альбомы"
description: "Все альбомы"
---
<h1>Альбомы</h1>

<div class="row g-4">
{%- for post in site.posts -%}
	{%- if post.categories contains 'albums' -%}
		<div class="col-md-4 col-lg-3">
			<div class="card h-100 d-flex flex-column shadow-sm hover-shadow">
				<a href='{{ post.url }}' class="text-center pt-3">
					<img src="/img/albums/preview/{{ post.image }}" class="img-fluid rounded-top" style="width:200px;height:200px;object-fit:cover;display:block;margin:0 auto;" alt="{{ post.title }}"/>
				</a>
				<div class='card-body d-flex flex-column'>
					<span class="badge text-bg-secondary mb-2">{{ post.date | date_to_string }}</span>
					<p class="card-text flex-grow-1">{{ post.title }}</p>
				</div>
			</div>
		</div>
	{%- endif -%}
{%- endfor -%}
</div>
